  utter_cancelar_cierre:
  - text: "La operación fue cancelada."
  - text: "Perfecto, continuaré atendiendo tu solicitud."
  
  utter_esta_resuelto:
  - text: "Antes de finalizar, ¿tu consulta o problema quedó resuelto en la plataforma?"

  utter_gracias_retroalimentacion:
  - text: "Muchas gracias por tu retroalimentación. Hemos guardado tus comentarios de forma segura. ¡Tu opinión nos ayuda a crecer! 🙌"
  
  utter_despedida:
  - text: "Gracias por utilizar el Tutor Virtual de la plataforma Zajuna. Estaremos disponibles cuando necesites ayuda nuevamente. ¡Hasta pronto! 👋"

  utter_despedida_sin_guardar:
  - text: >
      ⚠️ La sesión fue finalizada sin guardar el progreso actual.
      Si regresas más tarde podrías perder parte de la información de esta conversación.
      ¡Hasta pronto! 👋
  utter_guardando_progreso:
  - text: "Guardando tu progreso..."
  
  utter_ask_nivel_satisfaccion:

  - text: |
      Antes de finalizar, me gustaría conocer tu opinión.

      ¿Cómo calificarías la atención recibida?

      😊 Excelente
      🙂 Satisfactoria
      😐 Buena
      🙁 Regular
      😒 Mala
  
  utter_ask_problema_resuelto:
  - text: "¿Tu consulta o problema quedó resuelto? (sí/no)"
  
  utter_ask_calificacion_numerica:
  - text: |
      Por favor responde con un número del 1 al 5.

      1 = Muy insatisfecho
      2 = Insatisfecho
      3 = Neutral
      4 = Satisfecho
      5 = Muy satisfecho
  
  utter_ask_comentario:
  - text: "¿Deseas dejar un comentario adicional?"
  
  utter_solicitar_pregunta_faq:
    - text: |
        ❓ Escribe tu consulta sobre la plataforma Zajuna.

        Puedes escribir una nueva duda o volver a formular la anterior si aún no quedó resuelta.

        Ejemplos:

        • ¿Cómo recupero mi contraseña?
        • ¿Por qué no puedo ingresar a la plataforma?
        • ¿Qué significa el error 404?
        • ¿Cómo puedo subir una actividad?
        • ¿Por qué no carga el curso?
        • ¿Cómo ingreso al aula virtual?

        💡 Si lo que deseas es presentar una PQRSD o crear un caso de soporte, puedes hacerlo desde el menú de soporte.

  utter_ofrecer_continuar_soporte:
  - text: |
      ¿Pudiste resolver tu duda o deseas realizar otra acción?
