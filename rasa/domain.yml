version: "3.1"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - deny
  - affirm
  - cancelar
  - volver
  - ayuda
  - salir
  - consultar_certificados
  - ver_estado_estudiante
  - ir_menu_principal
  - ver_tutor_asignado
  - consultar_horarios_clases
  - consultar_progreso_curso
  - historial_academico
  - reiniciar_conversacion
  - ping_servidor
  - mostrar_token
  - recuperar_contrasena
  - reanudar_auto_si
  - reanudar_auto_no
  - terminar_conversacion_segura
  - confirmar_cierre_segura
  - cancelar_cierre_segura
  - negar_encuesta
  - pedir_humano
  - solicitar_soporte
  - soporte_tecnico
  - pqrs
  - contactar_tutor
  - reset_guardian
  - aprender_tema
  - ir_menu_academico
  - ir_menu_soporte
  - ir_menu_administrativo
  - dar_feedback
  - enviar_correo_recuperacion
  - explicacion_academica
  - preguntas_frecuentes
  - saludo
  - forzar_salida
  - solicitar_reinicio
  - ingresar_zajuna
  - auth_login_cmd
  - cancelar_handoff
  - cargar_progreso
  - confirmar_handoff
  - desconexion_usuario
  - guardar_autosave
  - guardar_estado_seguridad
  - guardian_reanudar_conversacion
  - inactividad_usuario
  - reconexion_usuario
  - recuperar_estado_seguridad
  - guardian_pausar_conversacion
  - iniciar_encuesta
  - solicitar_cierre
  - guardian_guardar_progreso
  - continuar_tema_si
  - despedida
  - respuesta_resuelto_si
  - respuesta_resuelto_no
  - calificar_bot
entities:
  - email
  - emocion
  - satisfaccion
  - comentario
  - nivel_satisfaccion
  - problema_resuelto
  - calificacion_numerica
  - nombre
  - motivo_soporte
  - prefer_contacto
  - telefono
  - mensaje
  - cedula
  - nota
  - encuesta_tipo
  - materia

slots:

  historial_academico:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        intent: informar_historial_academico
      - type: custom
 
  tema_actual:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  session_activa:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  encuesta_incompleta:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom

  nota:
    type: text
    mappings:
      - type: from_entity
        entity: nota

  esperando_resolucion:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom

  proceso_activo:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  user_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  session_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  
  turnos_conversacion:
    type: float
    initial_value: 0.0
    influence_conversation: false
    mappings:
      - type: custom

  sesion_larga:
    type: bool
    initial_value: false
    influence_conversation: true
    mappings:
      - type: custom

  user_token:
      type: text
      influence_conversation: false
      mappings:
        - type: custom

  slot_tipo_usuario:
      type: text
      influence_conversation: false
      mappings:
        - type: custom

  auth_state:
    type: categorical
    values:
    - inactive
    - active
    influence_conversation: false
    initial_value: inactive
    mappings:
    - type: custom
  
  llm_request:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  
  is_authenticated:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
    - type: custom

  ultimo_requerimiento:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  email:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: email
    - type: custom

    - type: from_text
      conditions:
        - active_loop: auth_login_form
          requested_slot: email

    - type: from_text
      conditions:
        - active_loop: password_recovery_form
          requested_slot: email

  password:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      conditions:
        - active_loop: auth_login_form
          requested_slot: password


  certificados:
    type: any
    influence_conversation: false
    mappings:
      - type: custom

  emocion_detectada:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: emocion
      - type: from_text
        intent: detectar_emocion

  encuesta_activa:
    type: bool
    influence_conversation: false
    initial_value: false
    mappings:
    - type: custom

  autosave_estado:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  nivel_satisfaccion:
    type: text
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
        - active_loop: encuesta_satisfaccion_form
          requested_slot: nivel_satisfaccion

  encuesta_tipo:
    type: categorical
    values:
      - positiva
      - negativa
      - neutra
    mappings:
      - type: custom

  problema_resuelto:
    type: text
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
        - active_loop: encuesta_satisfaccion_form
          requested_slot: problema_resuelto


  calificacion_numerica:
    type: text
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
        - active_loop: encuesta_satisfaccion_form
          requested_slot: calificacion_numerica

  comentario:
    type: text
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
        - active_loop: encuesta_satisfaccion_form
          requested_slot: comentario

  satisfaccion:
    type: text
    influence_conversation: true
    mappings:
    - type: custom

  feedback_texto:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      conditions:
        - active_loop: feedback_form
          requested_slot: feedback_texto


  reanudar_pendiente:
    type: bool
    initial_value: false
    influence_conversation: true
    mappings:
    - type: custom
  
  feedback_tipo:
    type: categorical
    influence_conversation: false
    values:
      - sugerencia
      - queja
      - felicitacion
      - error
    mappings:
      - type: from_text
        conditions:
          - active_loop: feedback_form
            requested_slot: feedback_tipo


  nombre:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: nombre
      - type: custom

  motivo_soporte:
    type: categorical
    values:
      - acceso
      - calificaciones
      - certificados
      - tecnico
      - otro
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: motivo_soporte
      - type: custom

  prefer_contacto:
    type: categorical
    values:
      - email
      - whatsapp
      - ninguno
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: prefer_contacto
      - type: custom

  telefono:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: telefono
      - type: custom

  derivacion_humano:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  tipo_soporte:
    type: categorical
    values:
      - interno
      - externo
      - tecnico
      - academico
      - administrativo
      - otro
    influence_conversation: true
    mappings:
      - type: custom

  menu_actual:
    type: categorical
    values:
      - principal
      - academico
      - administrativo
      - soporte
    influence_conversation: true
    mappings:
      - type: custom

  evento_seguridad:
    type: categorical
    influence_conversation: false
    values:
      - desconexion
      - inactividad
    mappings:
      - type: custom

  auth_token:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  cedula:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  soporte_mensaje:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  escalar_humano:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  soporte_form_fallback_count:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  confirmacion_cierre:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  tema_consulta:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  materia_detectada:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  rol_academico:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  mensaje:
      type: text
      influence_conversation: false
      mappings:
      - type: from_entity
        entity: mensaje
      - type: from_text
        conditions:
        - active_loop: soporte_form
          requested_slot: mensaje

  requires_auth:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom
  
  pending_action:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  
  auth_login_form:
    type: any
    influence_conversation: false
    mappings:
      - type: custom

  esperando_tema:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  nivel_explicacion:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  ultima_respuesta_llm:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  ultima_interaccion:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

forms:

  auth_login_form:
    required_slots:
      - email
      - password

  encuesta_satisfaccion_form:
    required_slots:
      - nivel_satisfaccion
      - problema_resuelto
      - calificacion_numerica
      - comentario

  feedback_form:
    required_slots:
      - feedback_tipo
      - feedback_texto

  soporte_form:
    required_slots:
      - nombre
      - email
      - mensaje

  password_recovery_form:
    required_slots:
      - email

responses:
  utter_cierre_confirmado_seguro:
  - text: "Cierre confirmado. Tu información ha sido gestionada y la sesión se ha cerrado correctamente. ¡Hasta pronto!"
  utter_respeto_decision:
  - text: "Entiendo tu decisión, respetaré tu espacio."
 
  utter_saludo_principal:
  - text: "¡Hola! Soy tu asistente Zajuna 👋 Este es el menú principal. ¿Qué deseas hacer?"
    buttons:
      - title: "🎓 Académico"
        payload: "/ir_menu_academico"
      - title: "🛠 Soporte técnico"
        payload: "/ir_menu_soporte"
      - title: "🏫 Trámites académicos / administrativos"
        payload: "/- ir_menu_administrativo"
  
  utter_control_conversacion:
  - text: "¿Deseas realizar otra consulta o terminar nuestra interacción?"
    buttons:
      - title: "🔄 Seguir consultando"
        payload: "/ir_menu_principal"
      - title: "🚪 Terminar conversación"
        payload: "/salir"
          
  utter_solicitar_tema:
  - text: >
      📚 Indícame el tema que deseas aprender.

      Ejemplos:

      • ¿Qué es el modelo OSI?
      • Explícame TCP/IP
      • ¿Qué son las VLAN?
      • Fundamentos de programación
      • Bases de datos relacionales

  utter_reinicio_confirmado:
    - text: "🔄 La sesión ha sido reiniciada con éxito. Todos los parámetros de seguridad y contexto se han limpiado."


  utter_ping_ok:
    - text: "⚡ [PONG] El servidor de acciones personalizadas se encuentra activo y respondiendo correctamente."
  
  utter_token_actual:
    - text: "🔐 Tu token de sesión actual es: {user_token}"
  
  utter_token_admin:
    - text: "🛡️ [MODO ADMINISTRADOR] Token de acceso verificado: {user_token}"

  utter_certificados_carousel:
   - text: "🎓 Actualmente no registras certificados disponibles para descarga."
  
  utter_ofrecer_contacto_tutor:
  - text: "📌 Noto que la sesión académica ha sido compleja. Si lo deseas, puedo generar un ticket de soporte técnico o enviarle un reporte detallado de tus dudas a tu Tutor Asignado para que te contacte directamente."

  utter_reanudar_conversacion:
  - text: >
      🔄 Encontré una sesión previa.
      ¿Deseas continuar donde la dejaste?
    buttons:
      - title: "✅ Sí"
        payload: "/reanudar_auto_si"
      - title: "❌ No"
        payload: "/reanudar_auto_no"

  utter_encuesta_satisfaccion:
  - text: "¿Cómo calificarías tu experiencia con la atención recibida?"

  utter_ofrecer_continuar:
  - text: >
      ¿Deseas continuar profundizando en este tema o prefieres realizar otra consulta?
    buttons:
      - title: "✅ Continuar tema"
        payload: "/continuar_tema_si"
      - title: "🏠 Menú principal"
        payload: "/ir_menu_principal"
      - title: "👋 Finalizar"
        payload: "/terminar_conversacion_segura"

  utter_ofrecer_humano:
  - text: "🤝 Veo que requieres asistencia especializada. ¿Deseas que transfiera esta sesión a un agente humano del SENA?
      ¿Deseas que realice la solicitud?"
    buttons:
      - title: "✅ Sí"
        payload: "/pedir_humano"
      - title: "❌ No"
        payload: "/continuar_tema_si"

  utter_menu_academico:
  - text: "📚 Has ingresado al Menú Académico. Aquí puedes consultar sobre tus asignaturas, guías de aprendizaje y resolver dudas temáticas con el LLM."
    buttons:
      - title: "📚 Aprender un tema"
        payload: "/aprender_tema"

      - title: "📜 Certificados"
        payload: "/consultar_certificados"

      - title: "📊 Estado estudiante"
        payload: "/ver_estado_estudiante"

      - title: "👨‍🏫 Tutor asignado"
        payload: "/ver_tutor_asignado"

      - title: "📚 Progreso curso"
        payload: "/consultar_progreso_curso"

      - title: "📅 Horarios"
        payload: "/consultar_horarios_clases"

      - title: "⏳ Historial Académico" 
        payload: "/historial_academico"


      - title: "🏠 Menú principal"
        payload: "/ir_menu_principal"

  utter_derivacion_cancelada:
  - text: >
        De acuerdo. Continuaremos la atención desde el asistente virtual.

  utter_derivar_humano_en_progreso:
  - text: "⏳ Procesando tu solicitud de transferencia. Por favor no cierres el chat..."

  utter_derivando_humano:
  - text: "🚀 Conectando con los canales de soporte en vivo de Zajuna..."

  utter_handoff_en_cola:
  - text: "📌 Te encuentras en la cola de atención técnica. Un asesor se comunicará contigo en breves momentos."

  utter_login_hint:
  - text: >
        Puedes autenticarte utilizando tu correo electrónico y contraseña.

  utter_confirmar_cierre_seguro:
  - text: "⚠️ Tienes un proceso o encuesta pendiente por responder. ¿Estás seguro de que deseas salir del sistema ahora?"

    buttons:
      - title: "💾 Guardar y salir"
        payload: "/confirmar_cierre_segura"
      - title: "Continuar conversación"
        payload: "/cancelar_cierre_segura"

  utter_menu_principal:
  - text: >
      🏠 Has regresado al menú principal.
      ¿Qué deseas hacer ahora?
    buttons:

      - title: "🎓 Menú Académico"
        payload: "/ir_menu_academico"

      - title: "📋 Menú Administrativo"
        payload: "/ir_menu_administrativo"

      - title: "🛠️ Menú Soporte"
        payload: "/ir_menu_soporte"

  utter_confirmar_cierre:
  - text: "Tienes un proceso activo. ¿Deseas salir y guardar tu progreso antes de cerrar la conversación?"
  - text: "¿Estás seguro de que deseas finalizar la conversación?"

  utter_cierre_confirmado:
  - text: "La conversación ha sido cerrada correctamente. Podrás retomarla más adelante."

  - text: "💾 Guardando tus respuestas de forma segura en los servidores de la plataforma..."

  utter_notificar_desconexion:
  - text: "⚠️ Se detectó una interrupción en tu conexión de red. Guardando estado actual de la sesión..."

  utter_notificar_inactividad:
  - text: "⏰ Tu sesión ha estado inactiva por un momento. Para proteger tu progreso, tus datos temporales se han guardado."

  utter_notificar_reconexion:
  - text: " Bienvenido nuevamente. Verificando si existe una sesión previa.⚡ ¡Conexión restablecida con éxito!"

  utter_preguntar_satisfaccion:
  - text: "¿Cómo calificarías la atención recibida?"

  utter_correo_enviado:
  - text: "✅ El correo fue enviado correctamente al tutor."

  utter_soporte_error:
  - text: "⚠️ Ocurrió un problema procesando tu solicitud."

  utter_form_fallback_warn:
  - text: "Parece que estamos teniendo dificultades para completar la información requerida."

  utter_menu_soporte:
  - text: |
      🔧 Menú de Soporte Técnico. 
      "Puedo ayudarte con problemas de acceso a Zajuna, restablecimiento de credenciales o transferirte a un asesor humano."

      Selecciona una opción:
    buttons:

      - title: "🎫 Crear caso"
        payload: "/solicitar_soporte"

      - title: "💬 Hablar con asesor"
        payload: "/pedir_humano"

      - title: "🔑 Recuperar contraseña"
        payload: "/recuperar_contrasena"

      - title: "📧 Contactar tutor"
        payload: "/contactar_tutor"

      - title: "🏠 Menú principal"
        payload: "/ir_menu_principal"

  utter_menu_administrativo:
  - text: |
      📋 Menú Administrativo

      Selecciona una opción:
    buttons:

      - title: "📜 Certificados"
        payload: "/consultar_certificados"

      - title: "🔑 Recuperar contraseña"
        payload: "/recuperar_contrasena"

      - title: "📧 Enviar solicitud"
        payload: "/recuperar_contrasena"

      - title: "🏠 Menú principal"
        payload: "/ir_menu_principal"

  utter_cierre_cancelado:
  - text: >
      👌 Perfecto, seguimos aquí.
      ¿En qué más puedo ayudarte?
    buttons:
      - title: "🏠 Menú principal"
        payload: "/ir_menu_principal"
      - title: "📄 Certificados"
        payload: "/consultar_certificados"
      - title: "📊 Estado académico"
        payload: "/ver_estado_estudiante"

  utter_volver_menu:
  - text: |
      ¿A dónde deseas ir?
    buttons:

      - title: "🎓 Menú Académico"
        payload: "/ir_menu_academico"

      - title: "📋 Menú Administrativo"
        payload: "/ir_menu_administrativo"

      - title: "🛠️ Menú Soporte"
        payload: "/ir_menu_soporte"

      - title: "🏠 Menú Principal"
        payload: "/ir_menu_principal"

  utter_confirmar_cierre_con_autosave:
  - text: "Detecté información pendiente de guardar. Puedo conservar tu progreso antes de cerrar la conversación. ¿Deseas continuar?"

  utter_cancelar_cierre:
  - text: "La operación fue cancelada."
  - text: "Perfecto, continuaré atendiendo tu solicitud."
  
  utter_esta_resuelto:
  - text: "Antes de finalizar, ¿tu consulta o problema quedó resuelto en la plataforma?"

  utter_gracias_retroalimentacion:
  - text: "Muchas gracias por tu retroalimentación. Hemos guardado tus comentarios de forma segura. ¡Tu opinión nos ayuda a crecer! 🙌"
  
  utter_despedida:
  - text: "Gracias por utilizar el Tutor Virtual de la plataforma Zajuna. Estaremos disponibles cuando necesites ayuda nuevamente. ¡Hasta pronto! 👋"

  utter_despedida_sin_guardar:
  - text: >
      ⚠️ La sesión fue finalizada sin guardar el progreso actual.
      Si regresas más tarde podrías perder parte de la información de esta conversación.
      ¡Hasta pronto! 👋
  utter_guardando_progreso:
  - text: "Guardando tu progreso..."
actions:
- action_ver_estado_estudiante
- action_tutor_asignado
- action_consultar_horarios_clases
- action_consultar_progreso_curso
- action_historial_academico
- action_aprender_tema
- action_reiniciar_conversacion
- action_ping_servidor
- action_set_default_tipo_usuario
- action_mostrar_token
- action_reset_turnos_conversacion
- action_check_auth
- action_ingreso_zajuna
- action_set_authenticated_true
- action_enviar_correo_recuperacion
- action_consultar_certificados
- action_analizar_estado_usuario
- action_cargar_autosave_mongo
- action_autoresume_conversacion
- action_registrar_encuesta
- action_guardar_feedback
- action_lanzar_encuesta_general
- action_preguntar_resolucion
- action_procesar_respuesta_resolucion
- action_set_encuesta_tipo
- validate_encuesta_satisfaccion_form
- action_enviar_correo
- action_conectar_humano
- action_health_check
- action_ofrecer_continuar_tema
- action_autosave_snapshot
- action_ofrecer_humano
- action_handoff_cancelar
- action_derivar_humano_confirmada
- action_cancelar_derivacion
- action_derivar_y_registrar_humano
- action_handoff_en_cola
- action_handle_with_llm
- action_ir_menu_principal
- action_ir_menu_academico
- action_ir_menu_soporte
- action_ir_menu_administrativo
- action_orchestrator_entry
- action_verificar_estado_encuesta_segura
- action_guardar_progreso_encuesta
- action_terminar_conversacion_segura
- action_guardian_guardar_progreso
- action_guardian_cargar_progreso
- action_guardian_pausar
- action_guardian_reanudar
- action_guardian_reset
- action_registrar_encuesta_guardian
- action_notificar_desconexion
- action_notificar_inactividad
- action_notificar_reconexion
- action_guardar_estado_seguridad
- action_recuperar_estado_seguridad
- action_session_start
- validate_soporte_form
- action_enviar_soporte
- action_soporte_submit
