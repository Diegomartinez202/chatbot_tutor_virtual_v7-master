version: "3.1"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - deny
  - affirm
  - cancelar
  - volver
  - salir
  - consultar_certificados
  - consultar_estado
  - ir_menu_principal
  - consultar_tutor
  - consultar_horarios
  - consultar_progreso
  - consultar_historial
  - reiniciar_conversacion
  - ping_servidor
  - mostrar_token
  - recuperar_contrasena
  - reanudar_auto_si
  - reanudar_auto_no
  - terminar_conversacion_segura
  - confirmar_cierre_segura
  - cancelar_cierre_segura
  - negar_encuesta
  - solicitar_soporte
  - pqrsd
  - contactar_tutor
  - reset_guardian
  - aprender_tema
  - ir_menu_academico
  - ir_menu_soporte
  - ir_menu_administrativo
  - dar_feedback
  - enviar_correo_recuperacion
  - explicacion_academica
  - preguntas_frecuentes
  - explicacion_preguntas_frecuentes
  - saludo
  - forzar_salida
  - solicitar_reinicio
  - ingresar_zajuna
  - auth_login_cmd
  - cancelar_handoff
  - cargar_progreso
  - confirmar_handoff
  - desconexion_usuario
  - guardar_autosave
  - guardar_estado_seguridad
  - guardian_reanudar_conversacion
  - inactividad_usuario
  - reconexion_usuario
  - recuperar_estado_seguridad
  - guardian_pausar_conversacion
  - iniciar_encuesta
  - solicitar_cierre
  - guardian_guardar_progreso
  - continuar_tema_si
  - despedida
  - respuesta_resuelto_si
  - respuesta_resuelto_no
  - calificar_bot
  - llm_fallback
  - describir_contenido_pqrsd
  - hablar_asesor
  - continuar_faq
  - radicar_pqrsd
  - crear_caso
  - solicitar_humano

entities:
  - email
  - emocion
  - satisfaccion
  - comentario
  - nivel_satisfaccion
  - problema_resuelto
  - calificacion_numerica
  - nombre
  - motivo_soporte
  - prefer_contacto
  - telefono
  - mensaje
  - cedula
  - nota
  - encuesta_tipo
  - materia

slots:

  esperando_encuesta_general:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  historial_academico:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        intent: informar_historial_academico
      - type: custom
 
  tema_actual:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  continuando_tema:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom

  session_activa:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  encuesta_incompleta:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom

  esperando_pqrsd:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  esperando_pregunta_faq:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom
  
  cambio_tema:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom

  nota:
    type: text
    mappings:
      - type: from_entity
        entity: nota

  esperando_resolucion:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom

  proceso_activo:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  user_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  session_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  
  turnos_conversacion:
    type: float
    initial_value: 0.0
    influence_conversation: false
    mappings:
      - type: custom

  sesion_larga:
    type: bool
    initial_value: false
    influence_conversation: true
    mappings:
      - type: custom

  user_token:
      type: text
      influence_conversation: false
      mappings:
        - type: custom

  slot_tipo_usuario:
      type: text
      influence_conversation: false
      mappings:
        - type: custom

  auth_state:
    type: categorical
    values:
    - inactive
    - active
    influence_conversation: false
    initial_value: inactive
    mappings:
    - type: custom
  
  llm_request:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  
  is_authenticated:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
    - type: custom

  ultimo_requerimiento:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  
  email:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: email
    - type: custom

    - type: from_text
      conditions:
        - active_loop: auth_login_form
          requested_slot: email

    - type: from_text
      conditions:
        - active_loop: password_recovery_form
          requested_slot: email

  password:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      conditions:
        - active_loop: auth_login_form
          requested_slot: password


  certificados:
    type: any
    influence_conversation: false
    mappings:
      - type: custom

  emocion_detectada:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: emocion
      - type: from_text
        intent: detectar_emocion

  encuesta_activa:
    type: bool
    influence_conversation: false
    initial_value: false
    mappings:
    - type: custom

  autosave_estado:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  nivel_satisfaccion:
    type: categorical
    values:
      - excelente
      - satisfactoria
      - buena
      - regular
      - mala
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
        - active_loop: encuesta_satisfaccion_form
          requested_slot: nivel_satisfaccion

  encuesta_tipo:
    type: categorical
    values:
      - positiva
      - negativa
      - neutra
    mappings:
      - type: custom

  esperando_decision_post_resolucion:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom
      
  problema_resuelto:
    type: text
    influence_conversation: false
    mappings:
      - type: custom


  calificacion_numerica:
    type: categorical
    values:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
        - active_loop: encuesta_satisfaccion_form
          requested_slot: calificacion_numerica

  comentario:
    type: text
    influence_conversation: true
    mappings:
    - type: from_text
      conditions:
        - active_loop: encuesta_satisfaccion_form
          requested_slot: comentario

  satisfaccion:
    type: text
    influence_conversation: false
    mappings:
    - type: custom

  feedback_texto:
    type: text
    influence_conversation: false
    mappings:
    - type: from_text
      conditions:
        - active_loop: feedback_form
          requested_slot: feedback_texto


  reanudar_pendiente:
    type: bool
    initial_value: false
    influence_conversation: true
    mappings:
    - type: custom
  
  feedback_tipo:
    type: categorical
    influence_conversation: false
    values:
      - sugerencia
      - queja
      - felicitacion
      - error
    mappings:
      - type: from_text
        conditions:
          - active_loop: feedback_form
            requested_slot: feedback_tipo


  nombre:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: nombre
      - type: custom

  motivo_soporte:
    type: categorical
    values:
      - acceso
      - calificaciones
      - certificados
      - tecnico
      - otro
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: motivo_soporte
      - type: custom

  prefer_contacto:
    type: categorical
    values:
      - email
      - whatsapp
      - ninguno
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: prefer_contacto
      - type: custom

  telefono:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: telefono
      - type: custom

  derivacion_humano:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  tipo_soporte:
    type: categorical
    values:
      - interno
      - externo
      - tecnico
      - academico
      - administrativo
      - otro
    influence_conversation: true
    mappings:
      - type: custom

  menu_actual:
    type: categorical
    values:
      - principal
      - academico
      - administrativo
      - soporte
    influence_conversation: true
    mappings:
      - type: custom

  evento_seguridad:
    type: categorical
    influence_conversation: false
    values:
      - desconexion
      - inactividad
    mappings:
      - type: custom

  auth_token:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  cedula:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  soporte_mensaje:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  escalar_humano:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  soporte_form_fallback_count:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  confirmacion_cierre:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

  tema_consulta:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  materia_detectada:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  rol_academico:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  mensaje:
      type: text
      influence_conversation: false
      mappings:
      - type: from_entity
        entity: mensaje
      - type: from_text
        conditions:
        - active_loop: soporte_form
          requested_slot: mensaje

  requires_auth:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom
  
  pending_action:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  
  tema_anterior:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  
  auth_login_form:
    type: any
    influence_conversation: false
    mappings:
      - type: custom

  esperando_tema:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  nivel_explicacion:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  ultima_respuesta_llm:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  ultima_interaccion:
    type: text
    influence_conversation: false
    mappings:
      - type: custom


  programa:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  ficha:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  estado_estudiante:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  ticket_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

forms:

  auth_login_form:
    required_slots:
      - email
      - password

  encuesta_satisfaccion_form:
    required_slots:
      - nivel_satisfaccion
      - calificacion_numerica
      - comentario

  feedback_form:
    required_slots:
      - feedback_tipo
      - feedback_texto

  soporte_form:
    required_slots:
      - nombre
      - email
      - mensaje

  password_recovery_form:
    required_slots:
      - email

responses:

  utter_ofrecer_continuar_faq:
  - text: |
      ¿Deseas realizar otra consulta sobre la plataforma Zajuna?

    buttons:
      - title: "❓ Otra pregunta"
        payload: "/continuar_faq"

      - title: "🛠️ Menú soporte"
        payload: "/ir_menu_soporte"

      - title: "🏠 Menú principal" 
        payload: "/ir_menu_principal" 

      - title: "👋 Finalizar"
        payload: "/terminar_conversacion_segura"

  utter_ofrecer_continuar_pqrsd:
  - text: |
      ¿Qué deseas hacer ahora?
    buttons:
      - title: "📝 Redactar otra PQRSD"
        payload: "/radicar_pqrsd"

      - title: "🎫 Crear caso"
        payload: "/solicitar_soporte"

      - title: "🛠 Soporte técnico"
        payload: "/ir_menu_soporte"

      - title: "🏠 Menú principal"
        payload: "/ir_menu_principal"

      - title: "👋 Finalizar"
        payload: "/terminar_conversacion_segura"

  utter_solicitar_pqrsd:
  - text: |
      📝 Voy a ayudarte a redactar una PQRSD.

      Primero indícame qué tipo de solicitud deseas presentar:

      • 📄 Petición: para solicitar información, un servicio o una gestión.
      • 😕 Queja: para manifestar inconformidad por la atención o el comportamiento de una persona.
      • ⚠️ Reclamo: cuando consideras que un servicio no fue prestado correctamente o se incumplió un derecho.
      • 💡 Sugerencia: para proponer una idea o mejora del servicio.
      • 🚨 Denuncia: para informar una posible irregularidad o situación que deba ser investigada.
      • 🎉 Felicitación: para reconocer una buena atención o destacar un servicio recibido.

      Después describe con el mayor detalle posible lo ocurrido.

      Con la información que me proporciones redactaré una PQRSD con lenguaje formal, respetando el tipo de solicitud indicado, para que puedas copiarla y radicarla por los canales oficiales del SENA.

  utter_cierre_confirmado_seguro:
  - text: "Cierre confirmado. Tu información ha sido gestionada y la sesión se ha cerrado correctamente. ¡Hasta pronto!"
  utter_respeto_decision:
  - text: "Entiendo tu decisión, respetaré tu espacio."
 
  utter_saludo_principal:
  - text: "¡Hola! Soy tu asistente Zajuna 👋 Este es el menú principal. ¿Qué deseas hacer?"
    buttons:
      - title: "🎓 Académico"
        payload: "/ir_menu_academico"
      - title: "🛠 Soporte técnico"
        payload: "/ir_menu_soporte"
      - title: "🏫 Trámites académicos / administrativos"
        payload: "/ir_menu_administrativo"
  
  utter_control_conversacion:
  - text: "¿Deseas realizar otra consulta o terminar nuestra interacción?"
    buttons:
      - title: "🔄 Seguir consultando"
        payload: "/ir_menu_principal"
      - title: "🚪 Terminar conversación"
        payload: "/salir"
          
  utter_login_requerido:
  - text: |
       🔒 Protección de tu información

       En el Tutor Virtual del SENA la seguridad de tus datos es una prioridad.

       Para proteger tu información personal y académica, algunas consultas requieren verificar previamente tu identidad mediante la autenticación institucional. De esta manera se garantiza que únicamente el titular de la cuenta pueda acceder a información como certificados, historial académico, horarios, tutor asignado, progreso de formación y demás datos personales.

       Toda consulta se realiza respetando los principios de confidencialidad, privacidad y uso seguro de la información, de acuerdo con los mecanismos de autenticación implementados por la plataforma institucional.

       A continuación encontrarás la orientación necesaria para realizar el proceso de autenticación y continuar con la consulta que solicitaste.
    
  utter_solicitar_tema:
  - text: >
      📚 Indícame el tema que deseas aprender.

      Ejemplos:

      • ¿Qué es el modelo OSI?
      • Explícame TCP/IP
      • ¿Qué son las VLAN?
      • Fundamentos de programación
      • Bases de datos relacionales

  utter_reinicio_confirmado:
    - text: "🔄 La sesión ha sido reiniciada con éxito. Todos los parámetros de seguridad y contexto se han limpiado."


  utter_ping_ok:
    - text: "⚡ [PONG] El servidor de acciones personalizadas se encuentra activo y respondiendo correctamente."
  
  utter_token_actual:
    - text: "🔐 Tu token de sesión actual es: {user_token}"
  
  utter_token_admin:
    - text: "🛡️ [MODO ADMINISTRADOR] Token de acceso verificado: {user_token}"

  utter_certificados_carousel:
   - text: "🎓 Actualmente no registras certificados disponibles para descarga."
  
  utter_ofrecer_contacto_tutor:
  - text: "📌 Noto que la sesión académica ha sido compleja. Si lo deseas, puedo generar un ticket de soporte técnico o enviarle un reporte detallado de tus dudas a tu Tutor Asignado para que te contacte directamente."

  utter_reanudar_conversacion:
  - text: >
      🔄 Encontré una sesión previa.
      ¿Deseas continuar donde la dejaste?
    buttons:
      - title: "✅ Sí"
        payload: "/reanudar_auto_si"
      - title: "❌ No"
        payload: "/reanudar_auto_no"

  utter_encuesta_satisfaccion:
  - text: "¿Cómo calificarías tu experiencia con la atención recibida?"

  utter_ofrecer_continuar:
  - text: >
      ¿Qué deseas hacer ahora?
    buttons:
      - title: "✅ Continuar tema"
        payload: "/continuar_tema_si"
      - title: "🏠 Menú principal"
        payload: "/ir_menu_principal"
      - title: "👋 Finalizar"
        payload: "/terminar_conversacion_segura"

  utter_fin_consulta_academica: 
  - text: | 
      ¿Qué deseas hacer ahora? 
    buttons: 
       - title: "📚 Menú académico" 
         payload: "/ir_menu_academico" 
       - title: "🏠 Menú principal" 
         payload: "/ir_menu_principal" 
       - title: "👋 Finalizar" 
         payload: "/terminar_conversacion_segura"
        
  utter_ofrecer_humano:
  - text: "🤝 Veo que requieres asistencia especializada. ¿Deseas que transfiera esta sesión a un agente humano del SENA?
      ¿Deseas que realice la solicitud?"
    buttons:
      - title: "✅ Sí"
        payload: "/hablar_asesor"
      - title: "❌ No"
        payload: "/continuar_tema_si"

  utter_menu_academico:
  - text: |
      🎓 Bienvenido al módulo académico.

      Aquí puedes aprender sobre un tema, resolver dudas relacionadas con tus cursos y recibir explicaciones apoyadas por inteligencia artificial.
    buttons:
      - title: "📚 Aprender un tema"
        payload: "/aprender_tema"

      - title: "🏠 Menú principal"
        payload: "/ir_menu_principal"


  utter_derivacion_cancelada:
  - text: >
        De acuerdo. Continuaremos la atención desde el asistente virtual.

  utter_derivar_humano_en_progreso:
  - text: "⏳ Procesando tu solicitud de transferencia. Por favor no cierres el chat..."

  utter_derivando_humano:
  - text: "🚀 Conectando con los canales de soporte en vivo de Zajuna..."

  utter_handoff_en_cola:
  - text: "📌 Te encuentras en la cola de atención técnica. Un asesor se comunicará contigo en breves momentos."

  utter_login_hint:
  - text: >
        Puedes autenticarte utilizando tu correo electrónico y contraseña.

  utter_confirmar_cierre_seguro:
  - text: "⚠️ Tienes un proceso o encuesta pendiente por responder. ¿Estás seguro de que deseas salir del sistema ahora?"

    buttons:
      - title: "💾 Guardar y salir"
        payload: "/confirmar_cierre_segura"
      - title: "Continuar conversación"
        payload: "/cancelar_cierre_segura"

  utter_menu_principal:
  - text: >
      🏠 Has regresado al menú principal.
      ¿Qué deseas hacer ahora?
    buttons:

      - title: "🎓 Menú Académico"
        payload: "/ir_menu_academico"

      - title: "📋 Menú Administrativo"
        payload: "/ir_menu_administrativo"

      - title: "🛠️ Menú Soporte"
        payload: "/ir_menu_soporte"

  utter_confirmar_cierre:
  - text: "¿Estás seguro de que deseas finalizar la conversación?"

  utter_confirmar_cierre_con_proceso:
  - text: "Tienes un proceso activo. ¿Deseas salir y guardar tu progreso antes de cerrar la conversación?"

  utter_cierre_confirmado:
  - text: "La conversación ha sido cerrada correctamente. Podrás retomarla más adelante."

  - text: "💾 Guardando tus respuestas de forma segura en los servidores de la plataforma..."

  utter_notificar_desconexion:
  - text: "⚠️ Se detectó una interrupción en tu conexión de red. Guardando estado actual de la sesión..."

  utter_notificar_inactividad:
  - text: "⏰ Tu sesión ha estado inactiva por un momento. Para proteger tu progreso, tus datos temporales se han guardado."

  utter_notificar_reconexion:
  - text: " Bienvenido nuevamente. Verificando si existe una sesión previa.⚡ ¡Conexión restablecida con éxito!"

  utter_preguntar_satisfaccion:
  - text: "¿Cómo calificarías la atención recibida?"

  utter_correo_enviado:
  - text: "✅ El correo fue enviado correctamente al tutor."

  utter_soporte_error:
  - text: "⚠️ Ocurrió un problema procesando tu solicitud."

  utter_form_fallback_warn:
  - text: "Parece que estamos teniendo dificultades para completar la información requerida."

  utter_menu_soporte:
  - text: |
      🔧 Menú de Soporte Técnico.

      Puedo ayudarte con problemas de acceso a Zajuna, resolver dudas frecuentes de la plataforma, crear solicitudes de soporte o indicarte cómo contactar a un asesor.

      Selecciona una opción:
    buttons:

      - title: "❓ Preguntas frecuentes"
        payload: "/preguntas_frecuentes"

      - title: "📝 PQRSD"
        payload: "/pqrsd"

      - title: "🎫 Crear caso"
        payload: "/solicitar_soporte"

      - title: "💬 Hablar con asesor"
        payload: "/hablar_asesor"

      - title: "🔑 Recuperar contraseña"
        payload: "/recuperar_contrasena"

      - title: "📧 Contactar tutor"
        payload: "/contactar_tutor"

      - title: "🏠 Menú principal"
        payload: "/ir_menu_principal"

  utter_ofrecer_continuar_administrativo:
  - text: |
      Cuando hayas iniciado sesión puedes volver al menú administrativo para continuar con tu consulta.
    buttons:
    
      - title: "🔐 Iniciar sesión"
        url: "https://zajuna.sena.edu.co/"
      - title: "📋 Menú administrativo"
        payload: "/ir_menu_administrativo"
      - title: "🏠 Menú principal"
