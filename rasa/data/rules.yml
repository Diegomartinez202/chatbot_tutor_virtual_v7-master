version: "3.1"

rules:
  
  - rule: Iniciar login
    steps:
        - intent: auth_login_cmd
        - action: auth_login_form
        - active_loop: auth_login_form

  - rule: consultar historial academico

    steps:
      - intent: historial_academico
      - action: action_historial_academico
  
  - rule: Finalizar login
    condition:
      - active_loop: auth_login_form
    steps:
      - action: auth_login_form
      - active_loop: null
      - action: action_check_auth

  - rule: Ir menú soporte
    steps:
      - intent: ir_menu_soporte
      - action: action_ir_menu_soporte

  - rule: Ir menú administrativo
    steps:
      - intent: ir_menu_administrativo
      - action: action_ir_menu_administrativo

  - rule: Reiniciar conversación
    steps:
      - intent: reiniciar_conversacion
      - action: action_reiniciar_conversacion

  - rule: Iniciar feedback
    steps:
      - intent: dar_feedback
      - action: feedback_form
      - active_loop: feedback_form

  - rule: Finalizar feedback
    condition:
      - active_loop: feedback_form
    steps:
      - action: feedback_form
      - active_loop: null
      - action: action_guardar_feedback
  
  - rule: Iniciar soporte
    steps:
      - intent: solicitar_soporte
      - action: action_iniciar_soporte

  - rule: Finalizar soporte
    condition:
      - active_loop: soporte_form
    steps:
      - action: soporte_form
      - active_loop: null
      - action: action_soporte_submit
  
  - rule: Solicitar humano
    steps:
      - intent: hablar_asesor
      - action: action_solicitar_humano
  
  - rule: Contactar tutor
    steps:
      - intent: contactar_tutor
      - action: action_contactar_tutor
   
  - rule: Guardar progreso guardian
    steps:
      - intent: guardian_guardar_progreso
      - action: action_guardian_guardar_progreso

  - rule: Pausar guardian
    steps:
      - intent: guardian_pausar_conversacion
      - action: action_guardian_pausar

  - rule: Reanudar guardian
    steps:
      - intent: guardian_reanudar_conversacion
      - action: action_guardian_reanudar
  
  - rule: Reinicio total del sistema
    steps:
      - intent: reset_guardian
      - action: action_guardian_reset

  - rule: Desconexión detectada
    steps:
      - intent: desconexion_usuario
      - action: action_notificar_desconexion

  - rule: Inactividad detectada
    steps:
      - intent: inactividad_usuario
      - action: action_notificar_inactividad

  - rule: Reconexión detectada
    steps:
      - intent: reconexion_usuario
      - action: action_notificar_reconexion
  
  - rule: Guardar autosave
    steps:
      - intent: guardar_autosave
      - action: action_autosave_snapshot
  
  - rule: Ping servidor
    steps:
      - intent: ping_servidor
      - action: action_ping_servidor
  
  - rule: Reanudar conversación
    steps:
      - intent: reanudar_auto_si
      - action: action_autoresume_conversacion

  - rule: Guardar estado seguridad
    steps:
      - intent: guardar_estado_seguridad
      - action: action_guardar_estado_seguridad

  - rule: Recuperar estado seguridad
    steps:
      - intent: recuperar_estado_seguridad
      - action: action_recuperar_estado_seguridad
  
  - rule: Cargar progreso guardian
    steps:
      - intent: cargar_progreso
      - action: action_guardian_cargar_progreso
  
  - rule: enviar correo recuperacion
    steps:
      - intent: enviar_correo_recuperacion
      - action: action_enviar_correo_recuperacion
      
  - rule: recuperar contraseña
    steps:
      - intent: recuperar_contrasena
      - action: password_recovery_form
      - active_loop: password_recovery_form
  
  - rule: submit password recovery
    condition:
      - active_loop: password_recovery_form
    steps:
      - action: password_recovery_form
      - active_loop: null
      - action: action_enviar_correo_recuperacion
  
  - rule: Desplegar Menú Principal al inicio o petición
    steps:
      - intent: saludo
      - action: utter_saludo_principal

  - rule: Activar formulario de inicio de sesión
    steps:
      - intent: ingresar_zajuna
      - action: auth_login_form
      - active_loop: auth_login_form

  - rule: Cancelar desvío a humano de forma directa
    steps:
      - intent: cancelar_handoff
      - action: action_handoff_cancelar

  - rule: Confirmar derivación a soporte técnico
    steps:
      - intent: confirmar_handoff
      - action: action_derivar_humano_confirmada

  - rule: Manejo de consultas generales fuera del árbol de diálogos
    condition:
      - slot_was_set:
        - proceso_activo: null
    steps:
      - intent: llm_fallback
      - action: action_handle_with_llm

  - rule: Responder solicitud de estado académico
    steps:
      - intent: ver_estado_estudiante
      - action: action_ver_estado_estudiante

  - rule: Finalizar encuesta (Submit)
    condition:
      - active_loop: encuesta_satisfaccion_form
    steps:
      - action: encuesta_satisfaccion_form
      - active_loop: null
      - action: action_registrar_encuesta 
      - slot_was_set:
        - encuesta_activa: false

  - rule: Cancelar encuesta_satisfaccion_form
    condition:
      - active_loop: encuesta_satisfaccion_form
    steps:
      - intent: cancelar
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_ir_menu_principal

  - rule: Cancelar auth_login_form
    condition:
      - active_loop: auth_login_form
    steps:
      - intent: cancelar
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_ir_menu_principal

  - rule: Cancelar feedback_form
    condition:
      - active_loop: feedback_form
    steps:
      - intent: cancelar
      - action: action_deactivate_loop
      - active_loop: null
      - action: action_ir_menu_principal

  - rule: Despliegue del menú principal
    steps:
      - intent: ir_menu_principal
      - action: action_ir_menu_principal
  
  - rule: Ir al menú académico siempre que se solicite
    steps:
      - intent: ir_menu_academico
      - action: action_ir_menu_academico

  - rule: Volver al menú anterior
    steps:
      - intent: volver
      - action: utter_volver_menu
  
  - rule: Cierre inteligente de conversación
    steps:
      - intent: despedida
      - action: action_confirmar_cierre
  
  - rule: Cierre inteligente de conversación (Finalización limpia)
    steps:
      - intent: salir
      - action: action_confirmar_cierre

  - rule: Iniciar flujo de cierre seguro
    steps:
      - intent: terminar_conversacion_segura
      - action: action_confirmar_cierre
      
  - rule: Cancelar cierre si el usuario se arrepiente
    condition:
      - slot_was_set:
          - confirmacion_cierre: "pendiente"
    steps:
      - intent: deny
      - action: action_cancelar_cierre

  - rule: Confirmar cierre seguro (cuando la confirmación está pendiente)
    condition:
       - slot_was_set:
           - confirmacion_cierre: "pendiente"
    steps:
      - intent: affirm
      - action: action_decidir_cierre

  
  - rule: Usuario indica que sí quedó resuelto
    condition:
      - slot_was_set:
          - esperando_resolucion: true
    steps:
      - intent: respuesta_resuelto_si
      - action: action_procesar_respuesta_resolucion
  
  - rule: Usuario indica que no quedó resuelto
    condition:
      - slot_was_set:
          - esperando_resolucion: true
    steps:
      - intent: respuesta_resuelto_no
      - action: action_procesar_respuesta_resolucion
  
  - rule: Affirm durante pregunta de resolución
    condition:
      - slot_was_set:
          - esperando_resolucion: true
    steps:
      - intent: affirm
      - action: action_procesar_respuesta_resolucion

  - rule: Deny durante pregunta de resolución
    condition:
      - slot_was_set:
          - esperando_resolucion: true
    steps:
      - intent: deny
      - action: action_procesar_respuesta_resolucion
      
  - rule: Guardar evaluación general
    steps:
      - intent: calificar_bot
      - action: action_guardar_calificacion_general
  
  - rule: Affirm durante evaluación general
    condition:
      - slot_was_set:
          - esperando_encuesta_general: true
    steps:
      - intent: affirm
      - action: action_lanzar_encuesta_general
  
  - rule: Deny durante evaluación general
    condition:
      - slot_was_set:
          - esperando_encuesta_general: true
    steps:
      - intent: deny
      - action: action_cierre_limpio


  - rule: Continuar aprendizaje después de resolución
    condition:
      - slot_was_set:
          - esperando_decision_post_resolucion: true
          - proceso_activo: aprender_tema
    steps:
      - intent: continuar_tema_si
      - action: action_memory_wrapper
      - action: action_handle_with_llm
      - action: action_ofrecer_continuar_tema
  
  
  - rule: Otra consulta FAQ después de resolución
    condition:
      - slot_was_set:
          - esperando_decision_post_resolucion: true
          - proceso_activo: faq
    steps:
      - intent: continuar_faq
      - action: action_solicitar_pregunta_faq
 
  - rule: Radicar PQRSD después de resolución
    condition:
      - slot_was_set:
          - esperando_decision_post_resolucion: true
          - proceso_activo: pqrsd
    steps:
      - intent: radicar_pqrsd
      - action: action_solicitar_pqrsd
  

  - rule: Continuar flujo FAQ activo
    condition:
      - slot_was_set:
          - proceso_activo: faq
          - esperando_pregunta_faq: true
    steps:
      - intent: explicacion_preguntas_frecuentes
      - action: action_preguntas_frecuentes_llm 
  
      
  - rule: Continuar flujo PQRSD activo
    condition:
      - slot_was_set:
          - proceso_activo: pqrsd
          - esperando_pqrsd: true
    steps:
      - intent: describir_pqrsd
      - action: action_pqrsd_llm
