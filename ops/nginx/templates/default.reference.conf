# Configuración Nginx para producción/dev - Reverse Proxy (plantilla común)
# Nota: este vhost usa un server_name propio para no colisionar con otros.
#       No se carga en DEV/PROD a menos que lo incluyas en tu nginx.conf.
# ======================================================
# PLANTILLA DE REFERENCIA
#
# No es utilizada por DEV.
# No es utilizada por PROD.
#
# Se conserva únicamente como ejemplo para pruebas
# locales o nuevos virtual hosts.
# ======================================================
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Host híbrido del widget
    location = /hybrid-host.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/" always;
        try_files /hybrid-host.html =404;
    }


    # Frontend React
    location / {
        proxy_pass http://admin_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ===============================
    # API Backend (FastAPI)
    # ===============================
    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ===============================
    # Rasa HTTP API (bajo /rasa/)
    # ===============================
    location /rasa/ {
        proxy_pass http://rasa_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;

        # CORS básico
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) { return 204; }
    }

    # ===============================
    # Salud directa de Rasa
    # (http://common.local/rasa/status si apuntas el host)
    # ===============================
    location = /rasa/status {
        proxy_pass http://rasa_upstream/status;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ===============================
    # Rasa WebSocket
    # ===============================
    location /ws/ {
        proxy_pass http://rasa_upstream/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

