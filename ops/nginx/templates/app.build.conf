# ==========================================================
# PLANTILLA HISTÓRICA
#
# No es cargada por nginx.
# Se conserva únicamente como referencia histórica para
# generación de configuraciones antiguas.
#
# Esta plantilla asume que los upstreams globales están
# definidos en:
#
#   conf.d/common/upstreams.conf
#
# y que el map:
#
#   $connection_upgrade
#
# está definido en:
#
#   nginx.dev.conf
#   nginx.prod.conf
#
# No volver a declararlos aquí.
# ==========================================================

server {

    listen 80;
    server_name _;

    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
    send_timeout          60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {

        proxy_pass http://admin_up;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        add_header Content-Security-Policy
        "default-src 'self';
         frame-ancestors 'self';
         img-src 'self' data: blob:;
         style-src 'self' 'unsafe-inline';
         script-src 'self';
         connect-src 'self' https: http: ws: wss:;"
        always;
    }

    location /api/ {

        if ($request_method = OPTIONS) {

            add_header Access-Control-Allow-Origin      $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization,Content-Type,Accept,Origin,User-Agent" always;

            return 204;
        }

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://backend_upstream/;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    location /rasa/ {

        proxy_pass http://rasa_upstream/;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 120s;
    }

    location /ws/ {

        proxy_pass http://rasa_upstream/ws/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

}