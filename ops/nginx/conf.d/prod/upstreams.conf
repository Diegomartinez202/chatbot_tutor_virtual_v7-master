upstream prueba_backend {

    zone prueba_backend 64k;

    server backend:8000 resolve;

    keepalive 32;
}

upstream backend_upstream {

    zone backend_upstream 64k;

    server backend:8000 resolve max_fails=3 fail_timeout=30s;

    keepalive 32;
}

upstream admin_up {

    zone admin_up 64k;

    server admin:80 resolve max_fails=3 fail_timeout=30s;

    keepalive 32;
}

upstream rasa_upstream {

    zone rasa_upstream 64k;

    server rasa:5005 resolve max_fails=3 fail_timeout=30s;

    keepalive 32;
}