# ==========================================================
# 🔁 Upstreams usados por locations.inc (y/o otros vhosts)
# ==========================================================
upstream admin_up {
  server admin:80;
}

upstream backend_upstream {
  server backend:8000;
  keepalive 32;
}

upstream rasa_upstream {
  server rasa:5005;
  keepalive 16;
}

# ==========================================================
# 🌐 SERVIDOR HTTPS PRINCIPAL
# ==========================================================
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  error_page 497 https://localhost$request_uri;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # 🔒 Parámetros TLS endurecidos
  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_ciphers               HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # Raíz SPA (mismo que default.conf)
  root  /usr/share/nginx/html;
  index index.html;

  # Inyectamos TODOS los locations comunes
  include /etc/nginx/conf.d/common/includes/locations.inc;
}