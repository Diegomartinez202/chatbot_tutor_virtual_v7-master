worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
    # ==========================================================
  # Desarrollo:
  # Se mantiene server_tokens con el valor por defecto para
  # facilitar el diagnóstico durante el desarrollo.
  # En Producción se recomienda ocultar la versión de Nginx
  # mediante:
  #
  # server_tokens off;
  # ==========================================================

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
    # Tamaño de la tabla hash para tipos MIME.
  # Se mantiene igual que Producción para evitar diferencias
  # de comportamiento entre entornos.
  types_hash_max_size 4096;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2
    application/font-woff
    application/font-woff2;

  include /etc/nginx/conf.d/**/*.conf;
}
